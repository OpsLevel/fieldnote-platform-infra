replicaCount: 2

image:
  repository: 123456789012.dkr.ecr.us-east-1.amazonaws.com/api
  tag: "1.0.0"

service:
  port: 8080

ingress:
  host: api.fieldnote.io
  path: /

env: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 1Gi

worker:
  enabled: false
  replicaCount: 2
  terminationGracePeriodSeconds: 30
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi
